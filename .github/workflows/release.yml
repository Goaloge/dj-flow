name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            dist: dist:win
            files: |
              dist/*.exe
              dist/*-win.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci || npm install
        shell: bash
      - run: npm test
        if: runner.os == 'macOS'
      - name: ffmpeg (LGPL) für Mac aus dem Quellcode bauen
        if: runner.os == 'macOS'
        run: |
          curl -sSfL -o ff.tgz https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n6.1.1.tar.gz
          tar xzf ff.tgz
          mkdir -p build/ffmpeg/mac
          build/ffmpeg-lgpl/build-mac.sh "$PWD/FFmpeg-n6.1.1" "$PWD/build/ffmpeg/mac/ffmpeg"
          ! build/ffmpeg/mac/ffmpeg -version | grep -E "enable-(gpl|nonfree)"
      - name: ffmpeg (LGPL) für Windows holen (BtbN/FFmpeg-Builds)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o ff.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-21-12-37/ffmpeg-n8.1.3-39-g660b5aa7db-win64-lgpl-8.1.zip"
          unzip -q ff.zip
          mkdir -p build/ffmpeg/win
          cp ffmpeg-*-win64-lgpl-8.1/bin/ffmpeg.exe build/ffmpeg/win/ffmpeg.exe
          ! build/ffmpeg/win/ffmpeg.exe -version | grep -E "enable-(gpl|nonfree)"
          build/ffmpeg/win/ffmpeg.exe -version | head -2
      - run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pakete-${{ matrix.os }}
          path: ${{ matrix.files }}
