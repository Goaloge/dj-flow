name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            dist: dist:mac
            ff_src: ffmpeg
            ff_dst: build/ffmpeg/mac/ffmpeg
            files: dist/*.dmg
          - os: windows-latest
            dist: dist:win
            ff_src: ffmpeg.exe
            ff_dst: build/ffmpeg/win/ffmpeg.exe
            files: |
              dist/*.exe
              dist/*-win.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci || npm install
        shell: bash
      - run: npm test
      - name: ffmpeg holen (ffmpeg-static, nicht im Repository)
        shell: bash
        run: |
          mkdir ../ffdl && cd ../ffdl && npm init -y >/dev/null && npm install ffmpeg-static@5.2.0
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$(dirname '${{ matrix.ff_dst }}')"
          cp "../ffdl/node_modules/ffmpeg-static/${{ matrix.ff_src }}" "${{ matrix.ff_dst }}"
      - run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pakete-${{ matrix.os }}
          path: ${{ matrix.files }}
